<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerario · Botánica, Savanna, Sir Pieper</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--bd:#dcdcd6;--ac:#14483a;--act:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1d;--tx:#eee;--mut:#9a9a9a;--bd:#333}}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1d;--tx:#eee;--mut:#9a9a9a;--bd:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 24px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:34px 20px;margin-bottom:14px;font-size:26px;letter-spacing:.12em;cursor:pointer;text-align:center}
.b-botanica{background:#14483a;color:#fff;font-weight:300}
.b-savanna{background:#1a0505;color:#ff4a4a;text-shadow:0 0 10px #f00;font-weight:700}
.b-sirpieper{background:#111;color:#fff;font-family:Georgia,serif;font-weight:700;letter-spacing:.04em}
.big small{display:block;font-size:13px;letter-spacing:0;opacity:.75;margin-top:6px;font-family:system-ui,sans-serif;text-shadow:none;font-weight:400}
.top{display:flex;align-items:center;gap:12px;padding:18px 16px;border-radius:14px;background:var(--ac);color:var(--act);margin-bottom:16px}
.top h2{margin:0;font-size:22px;flex:1}
.top button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.add{background:var(--ac);color:var(--act);border:0;border-radius:8px;padding:11px;font-size:15px;cursor:pointer}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.date{flex:none;width:58px;text-align:center;background:var(--ac);color:var(--act);border-radius:10px;padding:6px 0;line-height:1.1}
.date b{display:block;font-size:22px}.date span{font-size:12px;text-transform:uppercase}
.info{flex:1;min-width:0}.info h3{margin:0 0 2px;font-size:16px}
.meta{color:var(--mut);font-size:14px}.notes{font-size:14px;margin-top:4px;white-space:pre-wrap}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font-size:20px;align-self:flex-start}
.empty{color:var(--mut);text-align:center;padding:24px}
.hide{display:none}

.big{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:up .7s both}
.big:nth-of-type(2){animation-delay:.12s}.big:nth-of-type(3){animation-delay:.24s}
.big:hover{transform:translateY(-4px) scale(1.01)}
.lbl,.big small{position:relative;z-index:2}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{animation:up .6s both}
.deco{position:absolute;inset:0;z-index:1;pointer-events:none}
/* Botanica: hojas */
.leaf{position:absolute;bottom:-30px;left:var(--x);width:var(--s);height:var(--s);fill:#3f9b6b;opacity:0;animation:leaf var(--d) linear var(--t) infinite}
@keyframes leaf{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.55}50%{transform:translate(18px,-90px) rotate(40deg)}85%{opacity:.4}100%{transform:translate(-14px,-200px) rotate(-30deg);opacity:0}}
.b-botanica:hover{box-shadow:0 8px 30px rgba(63,155,107,.45)}
.b-botanica .lbl{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{letter-spacing:.17em}}
/* Savanna: neon */
.b-savanna{box-shadow:inset 0 0 0 2px #ff4a4a,0 0 18px rgba(255,0,0,.5),inset 0 0 22px rgba(255,0,0,.35);animation:up .7s both .12s,glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px #ff7a7a,0 0 34px rgba(255,0,0,.8),inset 0 0 34px rgba(255,0,0,.55)}}
.b-savanna .lbl{display:inline-block;animation:flicker 5s infinite}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1;text-shadow:0 0 6px #f33,0 0 14px #f00,0 0 32px #f00}20%,24%,55%{opacity:.35;text-shadow:none}}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 8px 2px #f00;left:var(--x);top:var(--y);animation:tw 2.4s ease-in-out var(--t) infinite;opacity:0}
@keyframes tw{50%{opacity:1;transform:scale(1.8)}}
/* Sir Pieper: espadas */
.sw{position:absolute;top:50%;width:64px;height:64px;margin-top:-32px;fill:#fff;opacity:.85}
.sw.l{left:18px;animation:swl 3s ease-in-out infinite}.sw.r{right:18px;animation:swr 3s ease-in-out infinite}
@keyframes swl{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg) translateX(8px)}}
@keyframes swr{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg) translateX(-8px)}}
.b-sirpieper:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite;z-index:1}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@media (max-width:480px){.sw{width:40px;height:40px;margin-top:-20px}}
@media (prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var VEN={
botanica:{n:"BOTÁNICA",ac:"#14483a",c:"b-botanica"},
savanna:{n:"SAVANNA",ac:"#b01212",c:"b-savanna"},
sirpieper:{n:"Sir Pieper Brewing Co.",ac:"#222222",c:"b-sirpieper"}};
var SEC={
evento:{t:"Eventos",f:["date","time","place","notes"],lab:"Fecha del evento",pl:"Lugar del evento"},
plan:{t:"Plan de marketing",f:["date","notes"],lab:"Fecha de la acción"},
sesion:{t:"Sesiones de fotos",f:["date","time","place","notes"],lab:"Fecha de la sesión"},
post:{t:"Publicaciones",f:["date","time","place","notes"],lab:"Fecha de publicación",pl:"Red social / lugar"},
reunion:{t:"Reuniones",f:["date","time","place","notes"],lab:"Fecha de la reunión"}};
var MES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
var SUPABASE_URL="https://agozlqryefezliodvuot.supabase.co";
var SUPABASE_KEY="sb_publishable_PqZgLGJc4YB-3lnSkUl6xw_3MFsPYXn";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var items=[],dbc=true,cur=null,tab="evento";
function list(v,s){return items.filter(function(i){return i.v===v&&i.s===s})}
function fail(){alert("No se pudo guardar. Revisa tu conexión y las políticas de Supabase.")}
function load(){
sb.from("items").select("*").then(function(r){
if(r.error){alert("Error al leer la base de datos: "+r.error.message);return}
items=r.data.map(function(x){return{id:x.id,v:x.venue,s:x.section,title:x.title,date:x.date,time:x.time,place:x.place,notes:x.notes}});
var ae=document.activeElement;
if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"))return;
render()})}
sb.channel("items-changes").on("postgres_changes",{event:"*",schema:"public",table:"items"},load).subscribe();
load();

function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function deco(k){
if(k==="botanica"){var L="";for(var i=0;i<9;i++)L+='<svg class="leaf" viewBox="0 0 24 24" style="--x:'+(6+i*11)+'%;--s:'+(18+(i%3)*8)+'px;--d:'+(6+(i%4))+'s;--t:'+(-i*0.9)+'s"><path d="M12 2C6 8 4 14 12 22 20 14 18 8 12 2Z"/><path d="M12 6V21" stroke="#14483a" stroke-width="1" fill="none"/></svg>';return '<div class="deco">'+L+'</div>'}
if(k==="savanna"){var P="";for(var j=0;j<10;j++)P+='<i class="spark" style="--x:'+((j*37+8)%95)+'%;--y:'+((j*53+12)%85)+'%;--t:'+(j*0.35)+'s"></i>';return '<div class="deco">'+P+'</div>'}
var sw='<g id="SW"><rect x="11" y="1" width="2" height="15"/><path d="M11 1L12 0L13 1Z"/><rect x="7" y="16" width="10" height="2" rx="1"/><rect x="11.3" y="18" width="1.4" height="3.5"/><circle cx="12" cy="22.5" r="1.3"/></g>';
var one=function(c){return '<svg class="sw '+c+'" viewBox="0 0 24 24"><g transform="rotate(45 12 12)">'+sw.replace(' id="SW"','')+'</g><g transform="rotate(-45 12 12)">'+sw.replace(' id="SW"','')+'</g></svg>'};
return '<div class="deco">'+one("l")+one("r")+'</div>'}
function go(v){location.hash=v||"";route()}
function route(){var h=location.hash.replace("#","");cur=VEN[h]?h:null;render()}
function render(){
var a=document.getElementById("app");
if(!cur){
document.documentElement.style.setProperty("--ac","#14483a");
a.innerHTML='<h1>Itinerario de boliches</h1><p class="sub">Elige un local para ver su calendario.</p>'+
Object.keys(VEN).map(function(k){return '<button class="big '+VEN[k].c+'" onclick="go(\''+k+'\')">'+deco(k)+'<span class="lbl">'+VEN[k].n+'</span><small>Eventos · Marketing · Fotos · Publicaciones · Reuniones</small></button>'}).join("");
return}
var v=VEN[cur];document.documentElement.style.setProperty("--ac",v.ac);
var s=SEC[tab],has=function(f){return s.f.indexOf(f)>-1};
var items=list(cur,tab).slice().sort(function(x,y){return (x.date+(x.time||"")).localeCompare(y.date+(y.time||""))});
a.innerHTML='<div class="top"><h2>'+v.n+'</h2><button onclick="go()">← Inicio</button></div>'+
'<div class="tabs">'+Object.keys(SEC).map(function(k){return '<button class="'+(k==tab?"on":"")+'" onclick="tab=\''+k+'\';render()">'+SEC[k].t+'</button>'}).join("")+'</div>'+
'<form onsubmit="return false"><label>Título / actividad<input id="f-title" placeholder="Ej: Campaña de lanzamiento"></label>'+
'<div class="row"><label>'+s.lab+'<input type="date" id="f-date"></label>'+(has("time")?'<label>Hora<input type="time" id="f-time"></label>':'')+'</div>'+
(has("place")?'<label>'+(s.pl||"Lugar")+'<input id="f-place"></label>':'')+
'<label>Notas<textarea id="f-notes" rows="2"></textarea></label>'+
'<button class="add" onclick="add()">+ Agregar</button></form>'+
(items.length?items.map(function(it){
var d=it.date?new Date(it.date+"T00:00:00"):null;
return '<div class="item"><div class="date">'+(d?'<b>'+d.getDate()+'</b><span>'+MES[d.getMonth()]+' '+d.getFullYear()+'</span>':'<b>–</b>')+'</div><div class="info"><h3>'+esc(it.title)+'</h3><div class="meta">'+
(it.time?'🕒 '+esc(it.time):'')+(it.place?' · 📍 '+esc(it.place):'')+'</div>'+(it.notes?'<div class="notes">'+esc(it.notes)+'</div>':'')+'</div><button class="del" title="Eliminar" onclick="del(\''+it.id+'\')">×</button></div>'}).join(""):'<div class="empty">Aún no hay nada en esta sección.</div>')+'<p class="meta" style="text-align:center">'+(dbc?"🟢 Guardado en Supabase":"")+'</p>';
}
function add(){
var g=function(i){var e=document.getElementById(i);return e?e.value.trim():""};
var t=g("f-title"),d=g("f-date");
if(!t||!d){alert("Escribe un título y elige una fecha.");return}
var it={id:"i"+Date.now()+Math.random().toString(36).slice(2,6),v:cur,s:tab,title:t,date:d,time:g("f-time"),place:g("f-place"),notes:g("f-notes")};
sb.from("items").insert({id:it.id,venue:it.v,section:it.s,title:it.title,date:it.date,time:it.time,place:it.place,notes:it.notes}).then(function(r){if(r.error)fail();else load()})}
function del(id){if(!confirm("¿Eliminar este elemento?"))return;sb.from("items").delete().eq("id",id).then(function(r){if(r.error)fail();else load()})}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
